name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -s -o /dev/null -w "root: %{http_code}\n" --max-time 90 https://usatofinder-backend.onrender.com/ || true
          curl -s -o /dev/null -w "app-ads: %{http_code}\n" --max-time 30 https://usatofinder-backend.onrender.com/app-ads.txt || true
